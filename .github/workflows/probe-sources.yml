# Temporary: what the candidate public-domain catalogs answer. Removed after one run.
name: Probe sources
on:
  push:
    branches: [claude/wonderful-einstein-h55pxx]
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          ua="Folio/1.0 (Android; +https://github.com/Akrishna87/folio)"
          get() { echo; echo "===== $1"; curl -sSL -A "$ua" --max-time 40 -w '\n[status %{http_code}, %{content_type}, %{size_download} bytes]\n' "$1" | head -c "${2:-2500}"; echo; }
          head1() { echo; echo "===== HEAD $1"; curl -sSIL -A "$ua" --max-time 40 "$1" | grep -iE '^(HTTP|content-type|content-length|location)' ; }
          echo "===== SE search page markup"
          curl -sSL -A "$ua" "https://standardebooks.org/ebooks?query=pride+and+prejudice&per-page=12" | python3 -c '
          import sys,re
          h=sys.stdin.read()
          i=h.find("<ol"); print(h[i:i+3500])
          print("...pages:", re.findall(r"<a[^>]*rel=\"next\"[^>]*>", h)[:2])'
          echo "===== SE popular (sort=popularity)"
          curl -sSL -A "$ua" "https://standardebooks.org/ebooks?sort=popularity&per-page=12" | grep -oE 'about="/ebooks/[^"]+"' | head -5
          echo "===== SE book page metadata"
          curl -sSL -A "$ua" "https://standardebooks.org/ebooks/jane-austen/pride-and-prejudice" | grep -oE '<meta[^>]+(description|og:image|og:title)[^>]*>|property="schema:description"[^>]*>[^<]{0,300}' | head -6
          echo "===== IA public-domain texts with an EPUB"
          Q='title:(pride prejudice) AND mediatype:texts AND format:EPUB AND collection:(americana OR toronto OR europeanlibraries OR gutenberg OR cdl OR library_of_congress) AND NOT collection:inlibrary AND NOT access-restricted-item:true'
          curl -sSL -A "$ua" -G "https://archive.org/advancedsearch.php" --data-urlencode "q=$Q" --data-urlencode "fl[]=identifier" --data-urlencode "fl[]=title" --data-urlencode "fl[]=creator" --data-urlencode "fl[]=date" --data-urlencode "fl[]=downloads" --data-urlencode "fl[]=collection" --data-urlencode "fl[]=language" --data-urlencode "sort[]=downloads desc" --data-urlencode "rows=5" --data-urlencode "output=json" | head -c 2500; echo
          ID=$(curl -sSL -A "$ua" -G "https://archive.org/advancedsearch.php" --data-urlencode "q=$Q" --data-urlencode "fl[]=identifier" --data-urlencode "sort[]=downloads desc" --data-urlencode "rows=1" --data-urlencode "output=json" | python3 -c 'import sys,json; print(json.load(sys.stdin)["response"]["docs"][0]["identifier"])')
          echo "first: $ID"
          curl -sSL -A "$ua" "https://archive.org/metadata/$ID" | python3 -c 'import sys,json; d=json.load(sys.stdin); m=d["metadata"]; print("collection:", m.get("collection"), "| restricted:", m.get("access-restricted-item"), "| rights:", m.get("rights"), m.get("possible-copyright-status"), "| year:", m.get("date")); [print(f["name"], f.get("format"), f.get("size")) for f in d["files"] if f["name"].endswith((".epub",".jpg")) and "thumb" not in f["name"]][:6]'
          curl -sSIL -A "$ua" "https://archive.org/download/$ID/$ID.epub" | grep -iE "^(HTTP|content-type|content-length)"
          echo "===== IA popular public-domain texts"
          curl -sSL -A "$ua" -G "https://archive.org/advancedsearch.php" --data-urlencode "q=mediatype:texts AND format:EPUB AND collection:(americana OR toronto) AND NOT access-restricted-item:true AND language:(English OR eng)" --data-urlencode "fl[]=identifier" --data-urlencode "fl[]=title" --data-urlencode "sort[]=downloads desc" --data-urlencode "rows=5" --data-urlencode "output=json" | head -c 1200; echo
