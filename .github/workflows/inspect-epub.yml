# Temporary: prints what's inside Gutenberg's EPUBs so reader layout problems can be reproduced.
name: Inspect an EPUB
on:
  push:
    paths: [".github/workflows/inspect-epub.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Text-only Pride and Prejudice
        run: |
          mkdir e && cd e
          curl -sL -o book.epub https://www.gutenberg.org/ebooks/1342.epub.noimages
          ls -la book.epub && unzip -q book.epub && find . -type f | sort
          echo "===== container"; cat META-INF/container.xml
          for f in $(find . -name '*.opf'); do echo "===== $f"; cat "$f"; done
          for f in $(find . -name '*.css'); do echo "===== $f"; cat "$f"; done
          for f in $(find . -name '*.xhtml' -o -name '*.html' | sort | head -4); do echo "===== $f (first 120 lines)"; head -c 9000 "$f"; echo; done
